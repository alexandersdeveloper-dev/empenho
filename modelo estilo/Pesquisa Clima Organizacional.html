<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pesquisa de Clima Organizacional · Secretaria de Finanças · Prefeitura de Parintins</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --c-blue:    #3ea3ff;
    --c-orange:  #b86a2b;
    --c-yellow:  #ffb829;
    --c-red:     #ea4242;

    --ink-900: #0f1622;
    --ink-700: #2a3344;
    --ink-500: #5b667a;
    --ink-400: #8590a3;
    --ink-300: #b4bccb;
    --line:    #e3e7ee;
    --line-2:  #eef1f6;
    --bg:      #ffffff;
    --bg-soft: #f6f8fb;
    --bg-card: #ffffff;

    --radius: 10px;
    --radius-lg: 14px;

    --font-sans: "Manrope", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    --font-display: "Fraunces", Georgia, serif;

    --shadow-sm: 0 1px 2px rgba(15,22,34,.04), 0 1px 1px rgba(15,22,34,.03);
    --shadow-md: 0 6px 24px -8px rgba(15,22,34,.12), 0 2px 6px rgba(15,22,34,.05);
    --shadow-lg: 0 24px 60px -20px rgba(15,22,34,.20), 0 6px 18px rgba(15,22,34,.06);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink-900); }
  body {
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }

  /* ---------- 4-color stripe ---------- */
  .stripe {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    height: 6px;
    width: 100%;
  }
  .stripe > i:nth-child(1) { background: var(--c-blue); }
  .stripe > i:nth-child(2) { background: var(--c-orange); }
  .stripe > i:nth-child(3) { background: var(--c-yellow); }
  .stripe > i:nth-child(4) { background: var(--c-red); }

  /* ---------- Header ---------- */
  .header-wrap {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,255,255,.92);
    backdrop-filter: saturate(180%) blur(10px);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .header {
    max-width: 1280px;
    margin: 0 auto;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .header-left { display: flex; align-items: center; gap: 20px; min-width: 0; }
  .header-logo { height: 56px; width: auto; display: block; }
  .header-divider { width: 1px; height: 38px; background: var(--line); }
  .header-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .header-meta .eyebrow {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-500);
  }
  .header-meta .title {
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-900);
    letter-spacing: -.005em;
  }

  .btn-services {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 11px 18px 11px 16px;
    background: var(--ink-900);
    color: #fff;
    border-radius: 999px;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: -.005em;
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
  }
  .btn-services:hover {
    background: #1a2436;
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  .btn-services .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--c-yellow);
    box-shadow: 0 0 0 3px rgba(255,184,41,.25);
  }
  .btn-services svg { width: 14px; height: 14px; opacity: .85; }

  /* ---------- Layout ---------- */
  main { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

  /* ---------- Hero ---------- */
  .hero {
    padding: 56px 0 36px;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 72px;
    align-items: start;
  }

  .crumbs {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-500);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .crumbs .sep { color: var(--ink-300); }
  .crumbs .now { color: var(--ink-900); font-weight: 600; }

  .h-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px 6px 8px;
    border-radius: 999px;
    background: #eaf4ff;
    color: #1a5fa8;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 24px;
  }
  .h-eyebrow .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--c-blue);
    box-shadow: 0 0 0 0 rgba(62,163,255,.6);
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(62,163,255,.6); }
    70%  { box-shadow: 0 0 0 10px rgba(62,163,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(62,163,255,0); }
  }

  h1.hero-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(40px, 4.6vw, 64px);
    line-height: 1.02;
    letter-spacing: -.025em;
    margin: 0 0 24px;
    color: var(--ink-900);
    text-wrap: pretty;
  }
  h1.hero-title .accent {
    font-style: italic;
    font-weight: 500;
    background: linear-gradient(95deg, var(--c-blue), var(--c-orange) 45%, var(--c-yellow) 70%, var(--c-red));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero-lead {
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink-500);
    max-width: 56ch;
    margin: 0 0 32px;
  }

  .hero-actions {
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 26px;
    background: var(--ink-900);
    color: #fff;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -.005em;
    box-shadow: var(--shadow-md);
    transition: transform .18s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
    background: #1a2436;
  }
  .btn-primary .arr { transition: transform .25s ease; }
  .btn-primary:hover .arr { transform: translateX(4px); }
  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    color: var(--ink-700);
    font-weight: 600;
    font-size: 14.5px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: #fff;
    transition: border-color .2s ease, color .2s ease, transform .15s ease;
  }
  .btn-ghost:hover { border-color: var(--ink-700); color: var(--ink-900); transform: translateY(-1px); }

  /* Hero stats */
  .hero-stats {
    margin-top: 44px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .stat .num {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -.02em;
    color: var(--ink-900);
    line-height: 1;
  }
  .stat .lbl {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--ink-500);
    letter-spacing: .005em;
  }
  .stat.b .num { color: var(--c-blue); }
  .stat.o .num { color: var(--c-orange); }
  .stat.r .num { color: var(--c-red); }

  /* ---------- Token Card (right of hero) ---------- */
  .token-card {
    position: relative;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: #fff;
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }
  .token-card::before {
    content: "";
    position: absolute; left: 0; top: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--c-blue) 0 25%, var(--c-orange) 25% 50%, var(--c-yellow) 50% 75%, var(--c-red) 75% 100%);
  }
  .tc-head {
    padding: 26px 28px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line-2);
  }
  .tc-head .lbl {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-500);
  }
  .tc-head .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #effaf2;
    color: #1f7a3f;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--font-mono);
    letter-spacing: .04em;
  }
  .tc-head .pill .dt { width: 6px; height: 6px; background: #2aa05a; border-radius: 50%; }

  .tc-body { padding: 28px; }
  .token-display {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 30px;
    letter-spacing: .14em;
    color: var(--ink-900);
    background: var(--bg-soft);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 22px 18px;
    text-align: center;
    user-select: all;
    position: relative;
  }
  .token-display .seg { display: inline-block; }
  .token-display .seg + .seg::before {
    content: "·"; color: var(--ink-300); margin: 0 10px; font-weight: 400;
  }
  .token-actions {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .ta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink-700);
    font-weight: 600;
    font-size: 13px;
    transition: border-color .2s, color .2s, background .2s;
  }
  .ta-btn:hover { border-color: var(--ink-700); color: var(--ink-900); background: #fafbfd; }
  .ta-btn.copied { border-color: #2aa05a; color: #1f7a3f; background: #f1faf3; }

  .tc-meta {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line-2);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 18px;
  }
  .tc-meta .row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .tc-meta .row .k {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-500);
  }
  .tc-meta .row .v {
    font-size: 13px;
    color: var(--ink-900);
    font-weight: 600;
  }

  /* ---------- Info section: pillars ---------- */
  .pillars {
    margin: 24px 0 80px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .pillar {
    padding: 28px;
    background: #fff;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .pillar .ico {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 10px;
    background: var(--bg-soft);
    color: var(--ink-700);
  }
  .pillar.b .ico { background: #eaf4ff; color: #1a5fa8; }
  .pillar.y .ico { background: #fff5dd; color: #8a5a08; }
  .pillar.r .ico { background: #fdecec; color: #b22e2e; }
  .pillar h3 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 20px;
    letter-spacing: -.015em;
    color: var(--ink-900);
  }
  .pillar p {
    margin: 0;
    font-size: 14px;
    color: var(--ink-500);
    line-height: 1.55;
  }
  .pillar .num-tag {
    align-self: flex-start;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-400);
  }

  /* ---------- "How it works" timeline ---------- */
  .how {
    padding: 64px 0 32px;
    border-top: 1px solid var(--line);
  }
  .section-head {
    display: flex;
    align-items: end;
    justify-content: space-between;
    margin-bottom: 36px;
    gap: 24px;
  }
  .section-head .left .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--c-orange);
    margin-bottom: 12px;
  }
  .section-head h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(28px, 3vw, 40px);
    letter-spacing: -.02em;
    margin: 0;
    color: var(--ink-900);
  }
  .section-head .right {
    color: var(--ink-500);
    font-size: 14.5px;
    max-width: 38ch;
    text-align: right;
  }

  .steps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .step {
    padding: 24px 22px 26px;
    background: #fff;
    border-right: 1px solid var(--line);
    position: relative;
  }
  .step:last-child { border-right: 0; }
  .step .n {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-400);
    letter-spacing: .14em;
    margin-bottom: 16px;
  }
  .step .ico-line {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    display: grid; place-items: center;
    margin-bottom: 16px;
  }
  .step h4 {
    margin: 0 0 6px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -.005em;
    color: var(--ink-900);
  }
  .step p {
    margin: 0;
    font-size: 13.5px;
    color: var(--ink-500);
    line-height: 1.5;
  }
  .step:nth-child(1) .ico-line { color: var(--c-blue); }
  .step:nth-child(2) .ico-line { color: var(--c-orange); }
  .step:nth-child(3) .ico-line { color: #c8941f; }
  .step:nth-child(4) .ico-line { color: var(--c-red); }

  /* ---------- Trust strip ---------- */
  .trust {
    padding: 56px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    align-items: center;
  }
  .trust-card {
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 28px;
    background: var(--bg-soft);
  }
  .trust-card h3 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 24px;
    margin: 0 0 12px;
    letter-spacing: -.015em;
  }
  .trust-card p { margin: 0 0 16px; color: var(--ink-700); font-size: 14.5px; line-height: 1.6; }
  .checks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .checks li { display: flex; gap: 10px; align-items: start; font-size: 14px; color: var(--ink-700); }
  .checks li svg { flex-shrink: 0; margin-top: 3px; color: #2aa05a; }
  .trust-vis {
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: #fff;
    padding: 32px;
    position: relative;
    overflow: hidden;
  }
  .trust-vis::after {
    content: "";
    position: absolute; right: -80px; bottom: -80px;
    width: 240px; height: 240px;
    background: radial-gradient(circle, rgba(62,163,255,.10), transparent 65%);
    pointer-events: none;
  }
  .vis-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .vis-grid .cell {
    aspect-ratio: 1/1;
    border-radius: 4px;
    background: var(--line-2);
  }
  .vis-grid .cell.b { background: var(--c-blue); }
  .vis-grid .cell.o { background: var(--c-orange); }
  .vis-grid .cell.y { background: var(--c-yellow); }
  .vis-grid .cell.r { background: var(--c-red); }
  .vis-grid .cell.muted { background: #e9eef6; }
  .vis-cap {
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-500);
  }

  /* ---------- FAQ ---------- */
  .faq {
    padding: 56px 0 80px;
    border-top: 1px solid var(--line);
  }
  .faq-grid {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 60px;
  }
  .faq-list { display: flex; flex-direction: column; }
  details.q {
    border-bottom: 1px solid var(--line);
    padding: 20px 0;
  }
  details.q[open] summary .plus { transform: rotate(45deg); }
  summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink-900);
    letter-spacing: -.005em;
  }
  summary::-webkit-details-marker { display: none; }
  .plus {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: grid; place-items: center;
    transition: transform .25s ease, border-color .2s, background .2s;
  }
  summary:hover .plus { border-color: var(--ink-700); background: #fafbfd; }
  details.q .ans {
    margin-top: 12px;
    color: var(--ink-500);
    font-size: 14.5px;
    line-height: 1.6;
    max-width: 64ch;
  }

  /* ---------- Footer ---------- */
  footer { background: #fff; }
  .footer-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 48px 32px 24px;
    display: grid;
    grid-template-columns: 1.4fr 1fr 1.1fr;
    gap: 56px;
    position: relative;
    overflow: hidden;
  }
  .footer-inner::after {
    content: "EU AMO PIN";
    position: absolute;
    right: -10px; top: 30px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 90px;
    letter-spacing: -.02em;
    color: rgba(184,106,43,.05);
    line-height: 1;
    pointer-events: none;
    user-select: none;
  }
  .f-brand img { height: 56px; width: auto; }
  .f-brand p {
    margin-top: 16px;
    font-size: 13.5px;
    color: var(--ink-500);
    line-height: 1.6;
    max-width: 36ch;
  }
  .f-col h5 {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -.005em;
    margin: 0 0 18px;
    color: var(--ink-900);
  }
  .f-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .f-col ul li a { font-size: 13.5px; color: var(--c-blue); transition: opacity .2s; }
  .f-col ul li a:hover { opacity: .7; }
  .f-contact { display: flex; flex-direction: column; gap: 14px; }
  .f-contact .item { display: flex; gap: 10px; align-items: start; font-size: 13.5px; color: var(--c-blue); }
  .f-contact .item svg { color: var(--c-blue); flex-shrink: 0; margin-top: 2px; }
  .copyright {
    max-width: 1280px;
    margin: 0 auto;
    padding: 18px 32px 28px;
    border-top: 1px solid var(--line-2);
    text-align: center;
    font-size: 12px;
    color: var(--ink-500);
  }

  /* ---------- Modal / Survey ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(15,22,34,.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    animation: fade .2s ease both;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 100%;
    max-width: 720px;
    max-height: 90vh;
    background: #fff;
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: pop .25s cubic-bezier(.2,.8,.2,1) both;
    position: relative;
  }

  /* Responsive */

    .lik { padding: 10px 4px; }
    .lik .lbl { font-size: 10.5px; }
  }
</style>

function genToken() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const seg = (n) => Array.from({length:n}, () => chars[Math.floor(Math.random()*chars.length)]).join("");
  return `${seg(4)}-${seg(4)}-${seg(4)}`;
}

function nowDateStr() {
  const d = new Date();

}

function deadlineStr() {
  // 30 days from current date

// ----- Token Card on hero -----
function TokenCard({ token, onStart, blocked }) {
  const [copied, setCopied] = useState(false);
  function copy() {
    try {
      navigator.clipboard.writeText(token);
      setCopied(true);
      setTimeout(()=>setCopied(false), 1800);
    } catch(e) {}
  }
  const segs = token.split("-");
  return (
    <div className="token-card">
      <div className="tc-head">
        <div>
          <div className="lbl">Token único de acesso</div>
        </div>
        <span className="pill"><span className="dt"></span> Válido</span>
      </div>
      <div className="tc-body">
        <div className="token-display" aria-label="Token de acesso">
          {segs.map((s, i) => <span key={i} className="seg">{s}</span>)}
        </div>
        <div className="token-actions">
          <button className={"ta-btn" + (copied ? " copied" : "")} onClick={copy}>
            {copied ? (
              <>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>

              <>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Copiar token
              </>
            )}
          </button>
          <button className="ta-btn" onClick={() => window.print()}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Imprimir
          </button>

// ----- Survey Modal -----
function SurveyModal({ token, onClose, onComplete }) {
  // step 0 = gate, step 1 = identify (setor + tempo), step 2..N = questions per section, last = review/submit
  const flatQuestions = useMemo(() => {
    const arr = [];
    SECTIONS.forEach(sec => sec.questions.forEach(q => arr.push({...q, section: sec.label, sectionId: sec.id})));
    return arr;
  }, []);

  // total steps: gate(0) + identify(1) + each question + done
  const totalSteps = 1 + 1 + flatQuestions.length; // before "done"
  const [step, setStep] = useState(0);
  const [identify, setIdentify] = useState({ setor: "", tempo: "", vinculo: "" });
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [protocol, setProtocol] = useState("");

  const bodyRef = useRef(null);

  useEffect(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = 0;
  }, [step]);

  function progress() {
    if (submitted) return 100;
    if (step === 0) return 4;
    if (step === 1) return 10;
    const idx = step - 2;
    return Math.min(95, 10 + Math.round((idx + 1) / flatQuestions.length * 85));
  }

  function canAdvance() {
    if (step === 0) return true;
    if (step === 1) return identify.setor && identify.tempo && identify.vinculo;
    const q = flatQuestions[step - 2];
    if (!q) return true;
    if (q.type === "likert") return answers[q.id] != null;
    if (q.type === "multi") return Array.isArray(answers[q.id]) && answers[q.id].length > 0;
    if (q.type === "text") return true; // optional
    return true;
  }

  function setAns(qid, v) {
    setAnswers(a => ({...a, [qid]: v}));
  }
  function toggleMulti(qid, opt, max) {
    setAnswers(a => {
      const cur = Array.isArray(a[qid]) ? [...a[qid]] : [];
      const i = cur.indexOf(opt);
      if (i > -1) cur.splice(i, 1);
      else if (!max || cur.length < max) cur.push(opt);
      return {...a, [qid]: cur};
    });
  }

  function next() {
    if (step >= totalSteps - 1) {
      // submit
      const proto = "PCO-" + Math.floor(100000 + Math.random()*900000);
      setProtocol(proto);
      setSubmitted(true);
      try {
        localStorage.setItem("pco_submitted", "1");
        localStorage.setItem("pco_protocol", proto);
        localStorage.setItem("pco_token_used", token);
      } catch(e) {}
      return;
    }
    setStep(s => s + 1);
  }
  function back() { if (step > 0) setStep(s => s - 1); }

  function close() {
    if (submitted) onComplete(protocol);
    else if (confirm("Tem certeza que deseja fechar a pesquisa? Suas respostas até aqui serão perdidas.")) onClose();
  }

  // ---- Render content ----
  let content;
  let stepInfo = "";
  let nextLbl = "Continuar";
  let nextIcon = <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;

  if (submitted) {
    content = (
      <div className="done">
        <div className="check"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <h4>Pesquisa enviada com sucesso.</h4>
        <p>Sua contribuição foi registrada de forma <strong>totalmente anônima</strong>. Obrigado por dedicar seu tempo à melhoria da Secretaria de Finanças.</p>
        <p>O relatório consolidado será divulgado no portal institucional após o encerramento do ciclo.</p>
        <div className="protocol">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Protocolo {protocol}
        </div>
      </div>
    );
    stepInfo = "Concluído";
    nextLbl = "Fechar";
    nextIcon = null;
  } else if (step === 0) {
    stepInfo = "Verificação de acesso";
    content = (
      <div className="token-gate">
        <div className="lock">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h4>Confirme o uso do seu token</h4>
        <p>Este token é exclusivo desta sessão e será marcado como utilizado após o envio. Você poderá responder a pesquisa <strong>uma única vez</strong>.</p>
        <div className="tk-display">{token}</div>
        <div className="id-note" style={{textAlign:'left',marginTop:6}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,marginTop:2}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Ao clicar em <strong>Iniciar pesquisa</strong> você confirma estar ciente de que os dados serão tratados de forma agregada e anônima, conforme a política institucional da SEFIN.</span>
        </div>
      </div>
    );
    nextLbl = "Iniciar pesquisa";
  } else if (step === 1) {
    stepInfo = `Etapa 1 de ${flatQuestions.length + 1}`;
    content = (
      <div>
        <div className="qheader">
          <div className="qmeta">Caracterização anônima</div>
          <h3 className="qtxt">Conte-nos um pouco sobre seu vínculo institucional.</h3>
          <p className="qsub">Estes dados são utilizados apenas para análise por grupos. Setores com menos de 5 participantes serão consolidados na categoria geral.</p>
        </div>
        <div className="id-form">
          <div className="id-field">
            <label>Setor / Departamento</label>
            <select value={identify.setor} onChange={e=>setIdentify(i=>({...i,setor:e.target.value}))}>
              <option value="">Selecione...</option>
              {SETORES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div className="id-field">
            <label>Tempo de serviço</label>
            <select value={identify.tempo} onChange={e=>setIdentify(i=>({...i,tempo:e.target.value}))}>
              <option value="">Selecione...</option>
              <option>Menos de 1 ano</option>
              <option>1 a 3 anos</option>
              <option>3 a 5 anos</option>
              <option>5 a 10 anos</option>
              <option>Mais de 10 anos</option>
            </select>
          </div>
          <div className="id-field" style={{gridColumn:'1 / -1'}}>
            <label>Tipo de vínculo</label>
            <select value={identify.vinculo} onChange={e=>setIdentify(i=>({...i,vinculo:e.target.value}))}>
              <option value="">Selecione...</option>
              <option>Servidor efetivo</option>
              <option>Cargo comissionado</option>
              <option>Contrato temporário</option>
              <option>Estagiário</option>
              <option>Prefiro não informar</option>
            </select>
          </div>
        </div>
        <div className="id-note">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2 4 5v6c0 5 3.5 9.7 8 11 4.5-1.3 8-6 8-11V5l-8-3z"/></svg>
          <span>Estas informações <strong>não identificam</strong> você individualmente. São utilizadas apenas para cruzamento estatístico.</span>
        </div>
      </div>
    );
  } else {
    const qIdx = step - 2;
    const q = flatQuestions[qIdx];
    stepInfo = `Pergunta ${qIdx + 1} de ${flatQuestions.length} · ${q.section}`;
    let body;
    if (q.type === "likert") {
      body = (
        <div className="likert">
          {LIKERT.map(l => (
            <button key={l.v} className={"lik" + (answers[q.id]===l.v ? " sel" : "")} onClick={()=>setAns(q.id, l.v)}>
              <span className="face">{l.face}</span>
              <span className="v">0{l.v}</span>
              <span className="lbl">{l.lbl}</span>
            </button>
          ))}
        </div>
      );
    } else if (q.type === "multi") {
      const sel = answers[q.id] || [];
      body = (
        <div className="choice-list">
          {q.options.map(opt => {
            const isSel = sel.includes(opt);
            const disabled = !isSel && q.max && sel.length >= q.max;
            return (
              <div key={opt} className={"choice" + (isSel ? " sel" : "")} style={disabled ? {opacity:.5,cursor:'not-allowed'} : {}} onClick={()=> !disabled && toggleMulti(q.id, opt, q.max)}>
                <div className="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
                <div className="lbl">{opt}</div>
              </div>
            );
          })}
        </div>
      );
    } else if (q.type === "text") {
      const v = answers[q.id] || "";
      body = (
        <div>
          <textarea className="tx" maxLength={1000} value={v} onChange={e=>setAns(q.id, e.target.value)} placeholder="Compartilhe sua opinião livremente. Sua resposta é anônima."></textarea>
          <div className="char-count">{v.length} / 1000</div>
        </div>
      );
    }

    content = (
      <div>
        <div className="qheader">
          <div className="qmeta">{q.section}</div>
          <h3 className="qtxt">{q.text}</h3>
          {q.sub && <p className="qsub">{q.sub}</p>}
        </div>
        {body}
      </div>
    );

    if (qIdx === flatQuestions.length - 1) nextLbl = "Enviar pesquisa";
  }

  return (
    <div className="overlay" role="dialog" aria-modal="true" onClick={(e)=>{ if(e.target.classList.contains('overlay')) close(); }}>
      <div className="modal">
        <div className="modal-head">
          <div>
            <div className="lbl">Pesquisa de Clima Organizacional · SEFIN</div>
            <h3>{submitted ? "Obrigado pela sua participação." : step === 0 ? "Antes de começar" : step === 1 ? "Caracterização" : "Sua opinião conta"}</h3>
          </div>
          <button className="modal-close" onClick={close} aria-label="Fechar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div className="progress-bar"><i style={{width: progress() + "%"}}></i></div>
        <div className="modal-body" ref={bodyRef}>{content}</div>
        <div className="modal-foot">
          <div className="step-info">{stepInfo}</div>
          <div className="actions">
            {!submitted && step > 0 && (<button className="btn-back" onClick={back}>Voltar</button>)}
            <button className="btn-next" onClick={submitted ? () => onComplete(protocol) : next} disabled={!canAdvance()}>
              {nextLbl}{nextIcon}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ----- App -----
function App() {
  const [token] = useState(() => {
    try {
      const existing = localStorage.getItem("pco_token");
      if (existing) return existing;
      const t = genToken();
      localStorage.setItem("pco_token", t);
      return t;
    } catch(e) { return genToken(); }
  });
  const [blocked, setBlocked] = useState(() => {
    try { return localStorage.getItem("pco_submitted") === "1"; } catch(e) { return false; }
  });
  const [showSurvey, setShowSurvey] = useState(false);

  function start() {
    if (blocked) return;
    setShowSurvey(true);
  }
  function complete(proto) {
    setShowSurvey(false);
    setBlocked(true);
  }

  return (
    <>
      <Header />
      <main>
        <Hero token={token} onStart={start} blocked={blocked} />
        <Pillars />
        <How />
        <Trust />
        <FAQ />
      </main>
      <Footer />
      {showSurvey && <SurveyModal token={token} onClose={()=>setShowSurvey(false)} onComplete={complete} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
